name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -nE "error:|e: |What went wrong|Execution failed|AAPT|Could not|not found" -A3 build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::${msg}"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: AllInOne-debug
          path: app/build/outputs/apk/debug/*.apk
